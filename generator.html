<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自动轮播 SVG 代码生成器</title>
<style>
  body{margin:0;background:#F9F1EC;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#3F3A37;}
  .wrap{max-width:900px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:20px;margin:0 0 6px;color:#2E2A27;}
  p.sub{font-size:13px;color:#8C8580;margin:0 0 22px;line-height:1.7;}
  .cols{display:flex;flex-wrap:wrap;gap:20px;}
  .col{flex:1 1 340px;min-width:300px;}
  label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px;color:#2E2A27;}
  textarea{width:100%;box-sizing:border-box;border:1px solid #E2D6CE;border-radius:8px;padding:10px;font-size:13px;font-family:Consolas,monospace;line-height:1.6;background:#fff;resize:vertical;}
  input[type=number]{width:100%;box-sizing:border-box;border:1px solid #E2D6CE;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;}
  .row{display:flex;gap:12px;}
  .row>div{flex:1;}
  button{background:#B54A33;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:16px;}
  button.ghost{background:#fff;color:#B54A33;border:1px solid #E2B8AC;}
  .preview{border:1px solid #E2D6CE;border-radius:10px;background:#fff;padding:12px;overflow:hidden;}
  .preview svg{display:block;width:100%;height:auto;border-radius:8px;overflow:hidden;}
  .hint{font-size:12px;color:#8C8580;margin-top:6px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <h1>自动轮播 SVG 代码生成器</h1>
  <p class="sub">粘贴公网图片 https 直链（一行一个），一键生成可直接粘进 <code>index.html</code> 的 SVG 轮播代码。最后一张会自动复用第一张，实现无缝循环。</p>

  <div class="cols">
    <div class="col">
      <label>图片地址（每行一个，至少 2 个）</label>
      <textarea id="urls" rows="8" placeholder="https://example.com/a.jpg&#10;https://example.com/b.jpg&#10;https://example.com/c.jpg"></textarea>

      <div class="row">
        <div>
          <label>画布宽（px）</label>
          <input type="number" id="fw" value="600" min="100" step="10">
        </div>
        <div>
          <label>画布高（px）</label>
          <input type="number" id="fh" value="800" min="100" step="10">
        </div>
      </div>

      <div class="row">
        <div>
          <label>每张停留（秒）</label>
          <input type="number" id="sec" value="3" min="0.5" step="0.5">
        </div>
        <div>
          <label>停留占比（0.5–0.95）</label>
          <input type="number" id="dwell" value="0.8" min="0.5" max="0.95" step="0.05">
        </div>
      </div>

      <button id="gen">生成代码</button>
      <button id="copy" class="ghost">复制 SVG 代码</button>
      <p class="hint" id="msg"></p>
    </div>

    <div class="col">
      <label>实时预览</label>
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <label>生成的 SVG 代码（粘到 index.html 的自动轮播位置）</label>
  <textarea id="out" rows="14" readonly></textarea>
</div>

<script>
function esc(s){ return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function fmt(n){ return (Math.round(n*100000)/100000).toString(); }

function build(){
  var urls = document.getElementById('urls').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var W = parseFloat(document.getElementById('fw').value)||600;
  var H = parseFloat(document.getElementById('fh').value)||800;
  var sec = parseFloat(document.getElementById('sec').value)||3;
  var h = parseFloat(document.getElementById('dwell').value)||0.8;
  if(h<0.5) h=0.5; if(h>0.95) h=0.95;
  if(urls.length < 2) return {err:'至少需要 2 个图片地址'};

  var N = urls.length;
  var frames = urls.concat([urls[0]]); // 末尾补第一张，实现无缝
  var images = '';
  for(var i=0;i<frames.length;i++){
    var u = esc(frames[i]);
    images += '        <image xlink:href="'+u+'" href="'+u+'" x="'+(W*i)+'" y="0" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid slice"/>\n';
  }

  var step = 1/N, kt=[], vs=[];
  for(var i=0;i<N;i++){
    var t0=i*step, t1=i*step+h*step, t2=(i+1)*step;
    kt.push(t0,t1,t2);
    var x0=-W*i, x1=-W*(i+1);
    vs.push(x0+' 0', x0+' 0', x1+' 0');
  }
  var dur = (N*sec).toFixed(2).replace(/\.00$/,'');

  var svg =
'<section style="max-width:640px; margin:0 auto; overflow:hidden; border-radius:10px;">\n'+
'    <svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:block; width:100%; height:auto; border-radius:10px; overflow:hidden;">\n'+
'      <g>\n'+ images +
'        <animateTransform attributeName="transform" attributeType="XML" type="translate" begin="0s" dur="'+dur+'s" repeatCount="indefinite" calcMode="linear"\n'+
'          keyTimes="'+kt.map(fmt).join(';')+'"\n'+
'          values="'+vs.join(';')+'"/>\n'+
'      </g>\n'+
'    </svg>\n'+
'  </section>';
  return {svg:svg};
}

function render(){
  var r = build();
  var out = document.getElementById('out');
  var preview = document.getElementById('preview');
  var msg = document.getElementById('msg');
  if(r.err){
    out.value='';
    preview.innerHTML='<p style="color:#8C8580;font-size:13px;">'+r.err+'</p>';
    msg.textContent = '';
    return;
  }
  out.value = r.svg;
  preview.innerHTML = r.svg;
  msg.textContent = '已生成，共 '+(document.getElementById('urls').value.split('\n').filter(function(s){return s.trim();}).length)+' 张（+1 张首图副本）';
}

document.getElementById('gen').addEventListener('click', render);
document.getElementById('urls').addEventListener('input', render);
['fw','fh','sec','dwell'].forEach(function(id){ document.getElementById(id).addEventListener('input', render); });
document.getElementById('copy').addEventListener('click', async function(){
  var out = document.getElementById('out');
  if(!out.value){ return; }
  try{
    await navigator.clipboard.writeText(out.value);
    document.getElementById('msg').textContent = '✅ 已复制到剪贴板';
  }catch(e){
    out.select(); document.execCommand('copy');
    document.getElementById('msg').textContent = '✅ 已复制（fallback）';
  }
});

// 默认示例
document.getElementById('urls').value =
  'https://img.hadrychen.top/images/tx-cos/20260916224452102.png?imageSlim\n'+
  'https://img.hadrychen.top/images/tx-cos/20260916230200886.jpg?imageSlim\n'+
  'https://img.hadrychen.top/images/tx-cos/20260916233225047.jpg?imageSlim\n'+
  'https://img.hadrychen.top/images/tx-cos/20260916233821863.jpg?imageSlim\n'+
  'https://img.hadrychen.top/images/tx-cos/20260917184916031.png';
render();
</script>
</body>
</html>
